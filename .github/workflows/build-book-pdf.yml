name: Build book PDF

on:
  push:
    branches:
      - main
    paths:
      - manuscript/book.md
      - manuscript/build_pdf.py
      - manuscript/pdf-header.tex
      - manuscript/figures/**
      - .github/workflows/build-book-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-lang-cjk \
            fonts-noto-cjk \
            fonts-dejavu-core \
            poppler-utils
          npm install -g @mermaid-js/mermaid-cli

      - name: Render Mermaid figures
        run: |
          mkdir -p manuscript/figures/rendered
          for src in manuscript/figures/F*.mmd; do
            base="$(basename "$src" .mmd)"
            echo "render $base"
            mmdc \
              --input "$src" \
              --output "manuscript/figures/rendered/$base.png" \
              --backgroundColor white \
              --width 1400 \
              --scale 2
          done
          test "$(find manuscript/figures/rendered -name 'F*.png' | wc -l)" -eq 21

      - name: Prepare print manuscript
        run: |
          python3 manuscript/build_pdf.py

      - name: Build PDF
        run: |
          mkdir -p manuscript/dist
          pandoc manuscript/build/book-pdf.md \
            --standalone \
            --from=gfm+raw_tex \
            --pdf-engine=xelatex \
            --top-level-division=chapter \
            --include-in-header=manuscript/pdf-header.tex \
            --resource-path=manuscript \
            --no-highlight \
            --output=manuscript/dist/ai-software-factory-rc2.pdf
          pdfinfo manuscript/dist/ai-software-factory-rc2.pdf | head -20
          test -s manuscript/dist/ai-software-factory-rc2.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ai-software-factory-rc2-pdf
          path: manuscript/dist/ai-software-factory-rc2.pdf
          if-no-files-found: error
          retention-days: 30
